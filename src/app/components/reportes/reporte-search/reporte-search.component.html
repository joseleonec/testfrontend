<div class="container">
  <h2>Generar Reporte</h2>

  <form [formGroup]="reporteForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="fechaInicio">Fecha Inicio</label>
      <input type="date" id="fechaInicio" formControlName="fechaInicio">
    </div>

    <div class="form-group">
      <label for="fechaFin">Fecha Fin</label>
      <input type="date" id="fechaFin" formControlName="fechaFin">
    </div>

    <div class="form-group">
      <label for="clienteId">Usuario (Cliente ID - ej: juanosorio)</label>
      <input type="text" id="clienteId" formControlName="clienteId">
    </div>

    <button type="submit" [disabled]="reporteForm.invalid">
      Generar
    </button>
  </form>
</div>
