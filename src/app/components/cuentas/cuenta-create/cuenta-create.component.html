<div class="container">
    <h2>Crear Cuenta</h2>

    <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
    </div>
    <div *ngIf="successMessage" class="success-message">
        {{ successMessage }}
    </div>

    <form [formGroup]="cuentaForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
            <label for="clienteId">ID del Cliente (Numérico)</label>
            <input type="number" id="clienteId" formControlName="clienteId" placeholder="Ej: 1">
            <div *ngIf="cuentaForm.get('clienteId')?.touched && cuentaForm.get('clienteId')?.invalid" class="error">
                ID de Cliente es requerido y debe ser numérico.
            </div>
        </div>

        <div class="form-group">
            <label for="numeroCuenta">Número de Cuenta</label>
            <input type="text" id="numeroCuenta" formControlName="numeroCuenta">
            <div *ngIf="cuentaForm.get('numeroCuenta')?.touched && cuentaForm.get('numeroCuenta')?.invalid"
                class="error">
                Número de cuenta es requerido (Solo números)
            </div>
        </div>

        <div class="form-group">
            <label for="tipoCuenta">Tipo de Cuenta</label>
            <select id="tipoCuenta" formControlName="tipoCuenta">
                <option value="Ahorros">Ahorros</option>
                <option value="Corriente">Corriente</option>
            </select>
        </div>

        <div class="form-group">
            <label for="saldoInicial">Saldo Inicial</label>
            <input type="number" id="saldoInicial" formControlName="saldoInicial">
            <div *ngIf="cuentaForm.get('saldoInicial')?.touched && cuentaForm.get('saldoInicial')?.invalid"
                class="error">
                Saldo inicial es requerido
            </div>
        </div>

        <div class="form-group">
            <label for="estado">Estado</label>
            <select id="estado" formControlName="estado">
                <option value="True">Activa</option>
                <option value="False">Inactiva</option>
            </select>
        </div>

        <button type="submit" [disabled]="cuentaForm.invalid || isSubmitting">
            {{ isSubmitting ? 'Guardando...' : 'Guardar Cuenta' }}
        </button>
    </form>
</div>
